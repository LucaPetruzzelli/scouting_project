name: scouting_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.15.4
  go_router: ^16.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.0
  shorebird_code_push: ^2.0.7
  flutter_dotenv: ^6.0.1
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.5
  image_picker: ^1.2.0
  file_picker: ^11.0.3
  csv: ^6.0.0
  share_plus: ^12.0.2
  path: ^1.9.0
  timeago: ^3.7.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "img/logo.png"