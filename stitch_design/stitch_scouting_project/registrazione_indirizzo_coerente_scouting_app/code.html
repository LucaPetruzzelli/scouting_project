<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2 dark:text-surface-variant">Dati del socio da registrare</p>

<form class="space-y-6">

<div class="flex justify-between items-center mb-6 px-4">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary dark:bg-primary-fixed dark:text-on-primary-fixed flex items-center justify-center font-bold mb-1">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1; font-size: 18px;">check</span>
</div>
<span class="font-label-md text-label-md text-primary dark:text-primary-fixed">Dati Base</span>
</div>
<div class="flex-1 h-0.5 bg-primary dark:bg-primary-fixed mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary dark:bg-primary-fixed dark:text-on-primary-fixed flex items-center justify-center font-bold mb-1">2</div>
<span class="font-label-md text-label-md text-primary dark:text-primary-fixed">Indirizzo</span>
</div>
<div class="flex-1 h-0.5 bg-surface-variant dark:bg-outline-variant mx-2"></div>
<div class="flex flex-col items-center opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant dark:bg-outline-variant dark:text-inverse-on-surface flex items-center justify-center font-bold mb-1">3</div>
<span class="font-label-md text-label-md text-on-surface-variant dark:text-surface-variant">Riepilogo</span>
</div>
</div>
<!-- Fields Container -->
<div class="space-y-4">
<!-- Indirizzo di Residenza -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant dark:text-surface-variant mb-1 ml-1" for="address">Indirizzo di Residenza</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3 text-on-surface-variant dark:text-surface-variant">
<span class="material-symbols-outlined">home</span>
</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest dark:bg-inverse-surface border border-outline dark:border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary dark:focus:ring-primary-fixed dark:focus:border-primary-fixed font-body-lg text-body-lg text-on-surface dark:text-inverse-on-surface transition-colors" id="address" name="address" placeholder="Via/Piazza" required="" type="text">
</div>
</div>
<!-- N. Civico and CAP Row -->
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant dark:text-surface-variant mb-1 ml-1" for="civic_number">N. Civico</label>
<div class="relative">
<input class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-inverse-surface border border-outline dark:border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary dark:focus:ring-primary-fixed dark:focus:border-primary-fixed font-body-lg text-body-lg text-on-surface dark:text-inverse-on-surface transition-colors" id="civic_number" name="civic_number" placeholder="es. 12/B" required="" type="text">
</div>
</div>
<div>

<input class="w-full px-4 py-3 bg-surface-container-lowest dark:bg-inverse-surface border border-outline dark:border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary dark:focus:ring-primary-fixed dark:focus:border-primary-fixed font-body-lg text-body-lg text-on-surface dark:text-inverse-on-surface transition-colors" id="zip_code" name="zip_code" placeholder="es. 70100" required="" type="text">
</div>
</div>
</div>

<div class="md:col-span-2">

</div>
</div>
<div>

<option disabled="" selected="" value="">Seleziona</option>
<option value="BA">BA</option>
<option value="BT">BT</option>
<option value="BR">BR</option>
<option value="FG">FG</option>
<option value="LE">LE</option>
<option value="TA">TA</option>
</select>
<span class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant dark:text-surface-variant pointer-events-none">
<span class="material-symbols-outlined">expand_more</span>
</span>
