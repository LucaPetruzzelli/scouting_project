<h1 class="font-headline-lg text-headline-lg text-on-surface dark:text-on-surface text-center leading-tight"><span class="text-scout-red">Scouting</span></h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline mt-2 text-center">AGESCI Bari 10</p>
</div>
<!-- Form Section -->
<form class="space-y-5">
<!-- Identifier Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface dark:text-on-surface font-semibold label-font pl-1 block" for="identifier">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-bright dark:bg-surface-container border border-outline-variant dark:border-outline rounded-xl text-on-surface dark:text-on-surface font-body-lg text-body-lg placeholder-outline dark:placeholder-outline focus:ring-2 focus:ring-scout-blue focus:border-scout-blue dark:focus:ring-scout-blue dark:focus:border-scout-blue transition-shadow duration-200" id="identifier" name="identifier" placeholder="Inserisci email" type="text">
</div>
</div>
<!-- Password Input -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface dark:text-on-surface font-semibold label-font pl-1 block" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-11 pr-11 py-3.5 bg-surface-bright dark:bg-surface-container border border-outline-variant dark:border-outline rounded-xl text-on-surface dark:text-on-surface font-body-lg text-body-lg placeholder-outline dark:placeholder-outline focus:ring-2 focus:ring-scout-blue focus:border-scout-blue dark:focus:ring-scout-blue dark:focus:border-scout-blue transition-shadow duration-200" id="password" name="password" placeholder="••••••••" type="password">
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-on-surface dark:hover:text-surface-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full flex items-center justify-center gap-2 bg-scout-red hover:bg-primary text-surface-white font-title-lg text-title-lg py-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">login</span>
<span class="">Accedi</span>
</button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-8 flex flex-col items-center gap-3">

                    Password dimenticata?
                </a><a class="font-body-md text-body-md text-scout-blue dark:text-secondary-fixed-dim hover:text-on-secondary-container dark:hover:text-secondary-fixed hover:underline transition-colors font-medium" href="#">

                </a>

<span class="material-symbols-outlined text-[18px]">help</span>

                </a>
</div>

</div>
